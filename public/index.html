<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sock Drawer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* ui.js adds this class while a sock is being edited */
    #sockForm.editing { background: #fff3cd; border: 2px solid #ffc107; border-radius: 6px; padding: 8px; }
  </style>
</head>

<body>
  <main class="container py-4">
    <h1>Sock Drawer</h1>

    <!-- Add / edit form. The hidden id tells us whether we are creating or updating. -->
    <form id="sockForm" class="row g-2 mb-4">
      <input type="hidden" id="sockId">
      <div class="col-md-4"><input id="title" class="form-control" placeholder="Title (e.g. blue stripey)" required></div>
      <div class="col-md-2">
        <select id="condition" class="form-select">
          <option>new</option>
          <option selected>good</option>
          <option>worn</option>
          <option>holey</option>
        </select>
      </div>
      <div class="col-md-4"><input id="tags" class="form-control" placeholder="Tags, comma separated"></div>
      <div class="col-md-2 d-grid"><button id="saveBtn" class="btn btn-primary">Add sock</button></div>
    </form>

    <!-- Search -->
    <div class="input-group mb-3">
      <input id="searchBox" class="form-control" placeholder="Search by title or tag">
      <button id="searchBtn" class="btn btn-outline-secondary">Search</button>
      <button id="clearFilterBtn" class="btn btn-outline-secondary">Show all</button>
    </div>

    <p id="message" class="text-danger"></p>

    <table class="table">
      <thead>
        <tr><th>Title</th><th>Condition</th><th>Tags</th><th>Notes</th><th></th></tr>
      </thead>
      <tbody id="sockList"></tbody>
    </table>
  </main>

  <!-- Order matters: api.js first, then ui.js, then main.js. -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
