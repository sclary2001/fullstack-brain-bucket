name: deploy-main-to-gcp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 34.39.144.144 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy HOTEL to GCP
        shell: bash
        env:
          SSH_USER: barrycumbie
          SSH_HOST: 34.39.144.144
          APP_DIR: app/server
          PM2_NAME: app
        run: |
          ssh -i ~/.ssh/deploy_key -T "$SSH_USER@$SSH_HOST" <<EOF
            set -e
            cd "$APP_DIR"
            git pull --ff-only origin main
            npm ci
            pm2 delete "$PM2_NAME" 2>/dev/null || true
            pm2 start app.js --name "$PM2_NAME"
            pm2 save
          EOF
